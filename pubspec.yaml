name: lazy_travel
description: LAZYTRAVEL — Hebrew-first AI trip planner for families.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  supabase_flutter: ^2.10.0
  google_fonts: ^6.3.2
  intl: any
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  path_provider: ^2.1.5
  http: ^1.5.0
  uuid: ^4.5.1
  flutter_pdfview: ^1.4.3
  share_plus: ^11.1.0
  path: ^1.9.1
  mime: ^2.0.0
  collection: ^1.19.1
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
